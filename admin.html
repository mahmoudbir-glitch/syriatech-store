<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Syriatech — لوحة التحكم</title><link rel="stylesheet" href="admin.css?v=2"></head><body><main class="wrap"><section id="loginView" class="panel login"><div class="logo">SYRIA<span>TECH</span></div><h1>لوحة تحكم المتجر</h1><p>دخول المدير فقط</p><input id="password" type="password" placeholder="كلمة مرور الأدمن"><button id="loginBtn">دخول</button><div id="loginMsg" class="msg"></div></section><section id="adminView" hidden><header class="top"><div><div class="logo">SYRIA<span>TECH</span></div><h1>إدارة المنتجات</h1></div><button id="logoutBtn" class="ghost">تسجيل الخروج</button></header><div class="grid"><section class="panel"><h2 id="formTitle">إضافة منتج</h2><form id="productForm"><input type="hidden" id="productId"><label>اسم المنتج<input id="name" required></label><label>الوصف<textarea id="description" rows="4" required></textarea></label><div class="two"><label>السعر<input id="price" type="number" min="0" step="0.01" required></label><label>السعر قبل الخصم<input id="oldPrice" type="number" min="0" step="0.01"></label></div><div class="two"><label>القسم<select id="category"><option value="power-bank">Power Bank</option><option value="charger">Chargers</option><option value="accessories">Accessories</option><option value="audio">Audio</option><option value="security">Security</option><option value="smart-home">Smart Home</option><option value="projector">Projectors</option><option value="solar">Solar</option></select></label><label>العلامة<input id="brand" value="Anker"></label></div><label>رابط الصورة<input id="image" type="url"></label><div class="upload"><input id="imageFile" type="file" accept="image/*"><button type="button" id="uploadBtn" class="secondary">رفع الصورة إلى Vercel Blob</button></div><img id="preview" class="preview" hidden><div class="actions"><button type="submit">حفظ المنتج</button><button type="button" id="resetBtn" class="ghost">جديد</button></div><div id="saveMsg" class="msg"></div></form></section><section class="panel"><div class="listHead"><h2>المنتجات المضافة</h2><input id="filter" placeholder="بحث..."></div><div id="products"></div></section></div></section></main><script src="admin.js?v=4" defer></script></body></html>
